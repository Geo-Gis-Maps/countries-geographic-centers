<style>
body { overflow: hidden; }

/* ── LAYOUT ── */
.map-page {
  position: fixed;
  top: var(--header-h);
  left: 0; right: 0; bottom: 0;
  display: flex;
}

/* ── MAP ── */
#main-map { flex: 1; position: relative; overflow: hidden; }
#leaflet-map { width: 100%; height: 100%; }

/* dark tile invert */
.dark-tiles .leaflet-tile-pane {
  filter: invert(1) hue-rotate(180deg) brightness(0.88) contrast(0.9);
}

/* ── CUSTOM TOOLTIP ── */
.cgc-tooltip {
  background: rgba(10,14,26,0.95);
  border: 1px solid #00c6ff;
  border-radius: 10px;
  padding: 10px 14px;
  min-width: 200px;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
[data-theme="light"] .cgc-tooltip {
  background: rgba(255,255,255,0.97);
  border-color: #0072ff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.tt-name {
  font-size: 1rem;
  font-weight: 800;
  color: #fff;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
[data-theme="light"] .tt-name { color: #1a2235; }
.tt-flag {
  width: 26px; height: 17px;
  object-fit: cover;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}
.tt-coords {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: #00c6ff;
  margin-bottom: 2px;
}
[data-theme="light"] .tt-coords { color: #0072ff; }
.tt-place {
  font-size: 0.72rem;
  color: #7a8ba8;
  margin-top: 2px;
}
.tt-hint {
  font-size: 0.65rem;
  color: #3a4b60;
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 6px;
}
[data-theme="light"] .tt-hint { color: #aaa; border-top-color: #ddd; }

/* ── SIDE PANEL ── */
#side-panel {
  width: 300px;
  min-width: 300px;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.25s, min-width 0.25s;
  flex-shrink: 0;
}
#side-panel.collapsed { width: 0; min-width: 0; border: none; }

/* panel toggle */
#panel-toggle {
  position: absolute;
  right: 300px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 900;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-right: none;
  color: var(--muted);
  width: 18px;
  height: 56px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px 0 0 6px;
  font-size: 0.6rem;
  font-weight: 800;
  transition: right 0.25s;
}
#panel-toggle:hover { background: var(--bg3); }
#side-panel.collapsed ~ #panel-toggle { right: 0; border-radius: 0 6px 6px 0; border: 1px solid var(--border); border-left: none; }

/* panel parts */
.panel-search-wrap {
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
.panel-search-wrap .search-box { border-radius: 8px; }
#panel-results {
  position: absolute;
  left: 12px; right: 12px;
  top: 58px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  max-height: 220px;
  overflow-y: auto;
  z-index: 50;
  display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
#panel-results.open { display: block; }

.panel-body { flex: 1; overflow-y: auto; padding: 14px 12px; }

.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 10px;
  color: var(--muted); text-align: center;
  padding: 20px;
}
.empty-state .e-icon { font-size: 2.4rem; opacity: 0.35; }
.empty-state p { font-size: 0.8rem; line-height: 1.6; }

/* info card */
.ic { display: none; }
.ic.show { display: block; }

.ic-flag {
  width: 100%; height: 110px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--border);
  margin-bottom: 12px;
  display: block;
  background: var(--bg3);
}
.ic-name {
  font-size: 1.25rem; font-weight: 800;
  line-height: 1.2; margin-bottom: 4px;
}
.ic-badge {
  display: inline-block;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.6px;
  background: rgba(0,198,255,0.1);
  color: #00c6ff;
  border: 1px solid rgba(0,198,255,0.4);
  padding: 2px 8px; border-radius: 100px;
  margin-bottom: 14px;
  text-transform: uppercase;
}
.ic-row {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 8px;
}
.ic-row-label {
  font-size: 0.65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--muted); margin-bottom: 3px;
}
.ic-row-value {
  font-size: 0.85rem; font-weight: 600;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  word-break: break-all;
}
.ic-row-value.plain { font-family: var(--font); font-size: 0.82rem; }

/* action buttons */
.ic-actions {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 10px;
}
.ic-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 10px 14px;
  border-radius: 8px; font-size: 0.85rem; font-weight: 700;
  cursor: pointer; border: none; text-decoration: none;
  transition: opacity 0.18s, background 0.18s;
}
.ic-btn:hover { opacity: 0.85; text-decoration: none; }
.ic-btn-primary {
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  color: #fff;
}
.ic-btn-row {
  display: flex; gap: 8px;
}
.ic-btn-sm {
  flex: 1; padding: 8px 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.78rem; font-weight: 600;
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 6px; transition: background 0.18s;
}
.ic-btn-sm:hover { background: var(--border); }
.ic-btn-sm.copied { color: #00c6ff; border-color: #00c6ff; }

/* ── PILL ── */
.map-pill {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  z-index: 800;
  background: rgba(0,0,0,0.6);
  color: #fff; padding: 5px 16px;
  border-radius: 100px; font-size: 0.74rem;
  pointer-events: none; white-space: nowrap;
  backdrop-filter: blur(4px);
}

/* ── LOADING BAR ── */
#load-bar {
  position: absolute; top: 0; left: 0;
  height: 3px; background: linear-gradient(90deg,#00c6ff,#0072ff);
  z-index: 999; transition: width 0.3s;
  border-radius: 0 2px 2px 0;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  #side-panel { display: none; }
  #panel-toggle { display: none; }
}
</style>

   HELPERS
═══════════════════════════════════════════ */
function slug(n){return n.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^0-9a-zA-Z\s\-]/g,'').trim().toLowerCase().replace(/\s+/g,'-');}
function fmtCoord(lat,lon){
  const la=lat>=0?lat.toFixed(6)+'°N':Math.abs(lat).toFixed(6)+'°S';
  const lo=lon>=0?lon.toFixed(6)+'°E':Math.abs(lon).toFixed(6)+'°W';
  return la+', '+lo;
}
function fmtLat(lat){return lat>=0?lat.toFixed(6)+'° N':Math.abs(lat).toFixed(6)+'° S';}
function fmtLon(lon){return lon>=0?lon.toFixed(6)+'° E':Math.abs(lon).toFixed(6)+'° W';}

let lang = localStorage.getItem('cgc_lang')||'en';
let currentCountry = null;

/* ═══════════════════════════════════════════
   THEME
═══════════════════════════════════════════ */
(function(){
  const t=localStorage.getItem('cgc_theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-btn').textContent=t==='dark'?'☀️':'🌙';
})();
document.getElementById('theme-btn').addEventListener('click',function(){
  const c=document.documentElement.getAttribute('data-theme');
  const n=c==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('cgc_theme',n);
  this.textContent=n==='dark'?'☀️':'🌙';
  document.getElementById('leaflet-map').classList.toggle('dark-tiles', n==='dark');
});

/* ═══════════════════════════════════════════
   LANG
═══════════════════════════════════════════ */
function applyLang(l){
  lang=l; localStorage.setItem('cgc_lang',l);
  document.documentElement.lang=l;
  const t=LANG[l]||LANG.en;
  document.getElementById('p-search').placeholder=t.searchPh;
  document.getElementById('hover-hint').textContent=t.hoverHint;
  document.getElementById('ic-badge').textContent=t.badge;
  document.getElementById('lbl-coords').textContent=t.coordsLbl;
  document.getElementById('lbl-lat').textContent=t.latLbl;
  document.getElementById('lbl-lon').textContent=t.lonLbl;
  document.getElementById('lbl-place').textContent=t.placeLbl;
  document.getElementById('lbl-open').textContent=t.openBtn;
  document.getElementById('lbl-copy').textContent=t.copyBtn;
  document.getElementById('lbl-share').textContent=t.shareBtn;
  document.getElementById('map-pill').textContent=t.pill;
  document.getElementById('lang-sel').value=l;
}
document.getElementById('lang-sel').addEventListener('change',function(){applyLang(this.value);});

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
document.getElementById('nav-toggle').addEventListener('click',function(){
  document.getElementById('nav-links').classList.toggle('open');
});

/* ═══════════════════════════════════════════
   PANEL TOGGLE
═══════════════════════════════════════════ */
const panel=document.getElementById('side-panel');
const ptBtn=document.getElementById('panel-toggle');
ptBtn.addEventListener('click',function(){
  panel.classList.toggle('collapsed');
  const c=panel.classList.contains('collapsed');
  ptBtn.textContent=c?'◀':'▶';
  ptBtn.style.right=c?'0':'300px';
});

/* ═══════════════════════════════════════════
   SHOW INFO
═══════════════════════════════════════════ */
function showInfo(name, lat, lon){
  currentCountry={name,lat,lon};
  const iso=ISO[name]||'';
  const s=slug(name);
  const place=PLACES[name]||'';
  const href='countries/right-in-the-middle-of-'+s+'.html';
  const t=LANG[lang]||LANG.en;

  document.getElementById('empty-state').style.display='none';
  const card=document.getElementById('info-card');
  card.classList.add('show');

  const flagEl=document.getElementById('ic-flag');
  if(iso){flagEl.src='assets/flags/'+iso+'.svg';flagEl.style.display='block';}
  else{flagEl.style.display='none';}

  document.getElementById('ic-name').textContent=name;
  document.getElementById('ic-coords').textContent=fmtCoord(lat,lon);
  document.getElementById('ic-lat').textContent=fmtLat(lat);
  document.getElementById('ic-lon').textContent=fmtLon(lon);

  const rp=document.getElementById('ic-row-place');
  if(place){document.getElementById('ic-place').textContent=place;rp.style.display='';}
  else{rp.style.display='none';}

  document.getElementById('ic-open').href=href;

  /* copy button */
  document.getElementById('btn-copy-coords').onclick=function(){
    const txt=fmtCoord(lat,lon)+' — '+name;
    navigator.clipboard.writeText(txt).then(()=>{
      this.classList.add('copied');
      const lbl=this.querySelector('span:last-child');
      const orig=lbl.textContent;
      lbl.textContent=(LANG[lang]||LANG.en).copied;
      setTimeout(()=>{lbl.textContent=orig;this.classList.remove('copied');},2000);
    });
  };

  /* share button */
  document.getElementById('btn-share').onclick=function(){
    const url=window.location.origin+window.location.pathname.replace('world-map.html','')+'countries/right-in-the-middle-of-'+s+'.html';
    if(navigator.share){
      navigator.share({title:'Geographic Center of '+name,text:fmtCoord(lat,lon),url:url});
    } else {
      navigator.clipboard.writeText(url).then(()=>{
        const lbl=this.querySelector('span:last-child');
        const orig=lbl.textContent;
        lbl.textContent=(LANG[lang]||LANG.en).shareDone;
        setTimeout(()=>{lbl.textContent=orig;},2500);
      });
    }
  };

  /* google maps */
  document.getElementById('btn-gmaps').onclick=function(){
    window.open('https://www.google.com/maps?q='+lat+','+lon,'_blank');
  };
}

/* ═══════════════════════════════════════════
   TOOLTIP HTML
═══════════════════════════════════════════ */
function buildTooltip(name, lat, lon){
  const iso=ISO[name]||'';
  const place=PLACES[name]||'';
  const flagHtml=iso?`<img class="tt-flag" src="assets/flags/${iso}.svg" alt="" onerror="this.style.display='none'">`:'';
  const t=LANG[lang]||LANG.en;
  return `<div class="cgc-tooltip">
    <div class="tt-name">${flagHtml}${name}</div>
    <div class="tt-coords">${fmtCoord(lat,lon)}</div>
    ${place?`<div class="tt-place">📍 ${place}</div>`:''}
    <div class="tt-hint">🖱 Click to open page</div>
  </div>`;
}

/* ═══════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════ */
function initSearch(inpId, resId, data, onSelect){
  const inp=document.getElementById(inpId);
  const res=document.getElementById(resId);
  if(!inp||!res)return;
  inp.addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    res.innerHTML=''; res.classList.remove('open');
    if(!q)return;
    const hits=data.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);
    if(!hits.length)return;
    hits.forEach(function(c){
      const iso=ISO[c.name]||'';
      const d=document.createElement('div');
      d.className='sr-item';
      d.innerHTML=(iso?`<img src="assets/flags/${iso}.svg" alt="" onerror="this.style.display='none'">`:'')
        +`<span>${c.name}</span><span class="sr-coords">${c.lat.toFixed(2)}°, ${c.lon.toFixed(2)}°</span>`;
      d.addEventListener('click',function(){
        inp.value=c.name; res.classList.remove('open');
        onSelect(c);
      });
      res.appendChild(d);
    });
    res.classList.add('open');
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('#'+resId)&&!e.target.closest('#'+inpId))res.classList.remove('open');
  });
}

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
let lmap=null;

fetch('assets/js/countries_coordinates.json')
  .then(r=>r.json())
  .then(function(data){
    applyLang(lang);
    initMap(data);
    const onSelect=function(c){
      if(lmap)lmap.setView([c.lat,c.lon],5,{animate:true});
      showInfo(c.name,c.lat,c.lon);
    };
    initSearch('p-search','panel-results',data,onSelect);
  });

function initMap(data){
  lmap=L.map('leaflet-map',{
    center:[20,10],zoom:2,minZoom:2,maxZoom:12,
    zoomControl:true,worldCopyJump:false
  });

  const mapEl=document.getElementById('leaflet-map');

  /* Tiles */
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    subdomains:'abc',maxZoom:19
  }).addTo(lmap);

  if((localStorage.getItem('cgc_theme')||'dark')==='dark'){
    mapEl.classList.add('dark-tiles');
  }

  /* ── Load GeoJSON layers ── */
  const loadBar=document.getElementById('load-bar');
  let loaded=0;
  const total=data.length;

  /* GeoJSON styles */
  const styleNormal={fillColor:'#1a6fa8',fillOpacity:0.4,color:'#00c6ff',weight:1,opacity:0.65};
  const styleHover ={fillColor:'#00c6ff',fillOpacity:0.65,color:'#ffffff',weight:2,opacity:1};
  const styleClick ={fillColor:'#ff9500',fillOpacity:0.65,color:'#ffffff',weight:2.5,opacity:1};

  let activeGeoLayer=null;
  const geoLayers={};

  data.forEach(function(c){
    const s=slug(c.name);
    fetch('assets/geodata/'+s+'.geojson')
      .then(function(r){loaded++;loadBar.style.width=Math.round(loaded/total*100)+'%';return r.ok?r.json():null;})
      .then(function(gj){
        if(!gj)return;
        const layer=L.geoJSON(gj,{
          style:function(){return Object.assign({},styleNormal);},
        }).addTo(lmap);

        /* tooltip on the layer */
        layer.bindTooltip(function(){return buildTooltip(c.name,c.lat,c.lon);},{
          sticky:true, opacity:1, className:'cgc-tooltip-wrap'
        });

        layer.on('mouseover',function(){
          if(activeGeoLayer!==layer) layer.setStyle(styleHover);
        });
        layer.on('mouseout',function(){
          if(activeGeoLayer!==layer) layer.setStyle(styleNormal);
        });
        layer.on('click',function(){
          if(activeGeoLayer&&activeGeoLayer!==layer) activeGeoLayer.setStyle(styleNormal);
          layer.setStyle(styleClick);
          activeGeoLayer=layer;
          showInfo(c.name,c.lat,c.lon);
          /* navigate after short delay so user sees the highlight */
          setTimeout(function(){
            window.location.href='countries/right-in-the-middle-of-'+s+'.html';
          },350);
        });

        geoLayers[s]=layer;
        if(loaded===total){setTimeout(()=>{loadBar.style.width='0%';loadBar.style.transition='none';},600);}
      })
      .catch(function(){loaded++;loadBar.style.width=Math.round(loaded/total*100)+'%';});
  });

  /* ── Center dots ── */
  const dotIcon=L.divIcon({
    className:'',
    html:'<div style="width:7px;height:7px;border-radius:50%;background:#ff9500;border:1.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 4px rgba(0,0,0,0.6);pointer-events:none;"></div>',
    iconSize:[7,7],iconAnchor:[3,3]
  });
  data.forEach(function(c){
    L.marker([c.lat,c.lon],{icon:dotIcon,interactive:false,zIndexOffset:1000}).addTo(lmap);
  });
}
</script>
